<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="80yUY1Wj-4n2UIzqfDLOQBpeC1xvds-kBhGurQCqk_4" />
    <meta property="og:title" content="CAD Viewer — Browser-based 3D CAD" />
    <meta property="og:site_name" content="CAD Viewer" />
    <meta
      property="og:description"
      content="Free, offline-capable 3D CAD viewer. Supports STEP, IGES, STL, OBJ, 3MF, BREP, GLB."
    />
    <meta property="og:url" content="https://cadviewer.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cadviewer.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CAD Viewer — Browser-based 3D CAD" />
    <meta
      name="twitter:description"
      content="Free, browser-based 3D CAD viewer. Supports STEP, IGES, STL, OBJ, 3MF, BREP, GLB, and DXF."
    />
    <meta name="twitter:image" content="https://cadviewer.xyz/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CAD Viewer",
        "description": "Open STEP, IGES, STL, OBJ, and more CAD formats instantly in your browser, then generate a fully dimensioned, true-to-scale 2D engineering drawing — no install required.",
        "url": "https://cadviewer.xyz/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "3D viewing for CAD and mesh formats",
          "Automatic 2D engineering drawing generation with true-to-scale PDF export",
          "Assembly explode and disassemble with per-part STEP export",
          "Measurement tools",
          "Section/cross-section controls",
          "Snapshot capture (normal and outline)",
          "DXF preview support"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CAD Viewer",
        "alternateName": "cadviewer.xyz",
        "url": "https://cadviewer.xyz/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CADViewer",
        "url": "https://cadviewer.xyz/",
        "logo": "https://cadviewer.xyz/favicon.svg",
        "founder": {
          "@type": "Person",
          "name": "Devaraj"
        },
        "sameAs": [
          "https://github.com/devaraj3/cad_viewer",
          "https://www.linkedin.com/in/devaraj1/"
        ]
      }
    </script>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; }
      /* The container that will hold the WebGL canvas */
      #viewport { height: 100vh; width: 100vw; }
      /* Ensure any canvas renders as a block and fills its parent */
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
