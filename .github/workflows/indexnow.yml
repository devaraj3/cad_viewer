name: Notify IndexNow
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Wait for deployment to go live
        run: sleep 180
      - name: Ping IndexNow
        run: node scripts/notify-indexnow.mjs
